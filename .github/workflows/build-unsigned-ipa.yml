name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          
      - name: Install dependencies
        run: npm install
        
      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean
        
      - name: Build Unsigned Archive
        run: |
          cd ios
          # The project name generated by Expo is typically the app name without spaces
          xcodebuild -workspace BongoStream.xcworkspace \
            -scheme BongoStream \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""
            
      - name: Package IPA
        run: |
          mkdir -p Payload
          mv ios/build/Build/Products/Release-iphoneos/BongoStream.app Payload/
          zip -r bongo-stream-unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-stream-unsigned-ipa
          path: bongo-stream-unsigned.ipa
